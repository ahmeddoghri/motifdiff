[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motifdiff"
version = "0.1.0"
description = "A masked discrete diffusion style MIDI generator with tonal metrics."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ahmed Doghri" }]
keywords = ["music-generation", "midi", "diffusion", "symbolic-music", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/ahmeddoghri/motifdiff"

[tool.hatch.build.targets.wheel]
packages = ["motifdiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F", "I"]
